<div
  class="fixed inset-0 -z-10 overflow-hidden pointer-events-none transition-colors duration-1000"
  [class]="activePreset().gradientClass"
>
  <!-- Ambient Glow Orbs -->
  <div
    class="absolute -top-40 -left-40 w-96 h-96 rounded-full blur-[140px] opacity-25 animate-pulse"
    [style.background-color]="activePreset().accentColor"
  ></div>
  <div
    class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full blur-[140px] opacity-20 animate-pulse"
    [style.background-color]="activePreset().accentColor"
    style="animation-delay: 2s;"
  ></div>

  <!-- Subtle scanline / grid texture overlay -->
  <div
    class="absolute inset-0 bg-[radial-gradient(rgba(255,255,255,0.03)_1px,transparent_1px)] [background-size:24px_24px]"
  ></div>
  <div class="absolute inset-0 bg-black/40"></div>
</div>
