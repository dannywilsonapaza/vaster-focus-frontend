server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para máxima velocidad de transferencia
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # Enrutamiento SPA: cualquier ruta desconocida se entrega con index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Evitar caché en index.html para que los despliegues se reflejen de inmediato
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Caché agresivo para activos estáticos con hash inmutable (js, css, fuentes, iconos)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Página de error por defecto
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
